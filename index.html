<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>FADU Bienestar</title>
<meta name="description" content="FADU Bienestar: deportes, rutas, consultoría psicológica y agenda de cursada. Demo en HTML, CSS y JavaScript puros.">
<meta name="theme-color" content="#232323">
<style>
  *, *::before, *::after { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  :root {
    --ink: #1E1E1E;
    --dark: #232323;
    --dark-2: #2A2A2A;
    --green: #15B86C;
    --blue: #1E88E5;
    --bg: #F4F5F7;
    --line: #E5E7EB;
    --muted: #6B7280;
    --white: #FFFFFF;
  }
  body {
    background: var(--bg);
    color: var(--ink);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    -webkit-font-smoothing: antialiased;
    -moz-osx-font-smoothing: grayscale;
  }
  button, input, select, textarea { font: inherit; color: inherit; }
  button { cursor: pointer; border: 0; background: none; padding: 0; }
  h1, h2, h3, h4, h5, p { margin: 0; }
  svg { display: block; }
  .icon {
    width: 20px; height: 20px; flex: none;
    fill: none; stroke: currentColor;
    stroke-width: 2; stroke-linecap: round; stroke-linejoin: round;
    display: inline-block; vertical-align: middle;
  }
  .icon.sm { width: 16px; height: 16px; }
  .icon.xs { width: 14px; height: 14px; }
  .sr-only {
    position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px;
    overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0;
  }

  /* ---------- Marco tipo teléfono ---------- */
  .shell {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 16px;
  }
  .phone {
    position: relative;
    width: 430px;
    height: 860px;
    background: var(--white);
    border: 1px solid var(--line);
    border-radius: 40px;
    box-shadow: 0 25px 50px -12px rgba(0, 0, 0, .25);
    overflow: hidden;
    display: flex;
    flex-direction: column;
  }

  /* ---------- Login ---------- */
  .login-phone { padding: 44px 28px 30px; justify-content: space-between; }
  .login-head { text-align: center; padding-top: 8px; }
  .logo { display: flex; align-items: baseline; justify-content: center; letter-spacing: -.045em; }
  .logo-fadu { font-size: 54px; font-weight: 900; line-height: .9; color: var(--ink); }
  .logo-bien { font-size: 28px; font-weight: 700; margin-left: 6px; color: var(--ink); }
  .login-sub { font-size: 13.5px; color: #9CA3AF; font-weight: 500; margin-top: 6px; letter-spacing: -.01em; }
  .login-card {
    background: #222;
    border: 1px solid #3F3F46;
    border-radius: 28px;
    padding: 24px;
    box-shadow: 0 20px 25px -5px rgba(0, 0, 0, .2);
    margin: auto 0;
  }
  .field { margin-bottom: 18px; }
  .field:last-of-type { margin-bottom: 0; }
  .field > label, .label-row > label {
    display: block; color: #fff; font-size: 14px; font-weight: 500; margin-bottom: 8px;
  }
  .label-row { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-bottom: 8px; }
  .label-row > label { margin: 0; }
  .link { color: #2575FC; font-size: 13px; font-weight: 500; }
  .link:hover { color: #60A5FA; }
  .input-wrap { position: relative; display: flex; align-items: center; }
  .input-wrap > .icon { position: absolute; left: 15px; color: #9CA3AF; pointer-events: none; }
  .input-wrap input {
    width: 100%;
    background: #fff;
    color: #111827;
    border: 0;
    border-radius: 16px;
    padding: 14px 16px 14px 48px;
    font-size: 15px;
    font-weight: 500;
    outline: none;
  }
  .input-wrap input:focus { box-shadow: 0 0 0 2px var(--blue); }
  .input-wrap input::placeholder { color: #9CA3AF; }
  .switch-row {
    display: flex; align-items: center; justify-content: space-between; gap: 12px;
    color: #D4D4D8; font-size: 13.5px; cursor: pointer; position: relative;
  }
  .login-card .switch-row { margin: 18px 0 22px; }
  .switch-input { position: absolute; opacity: 0; width: 1px; height: 1px; }
  .switch {
    position: relative; display: inline-block; flex: none;
    width: 56px; height: 32px; border-radius: 999px;
    background: #52525B; border: 1px solid #71717A;
    transition: background .2s ease, border-color .2s ease;
  }
  .switch::after {
    content: ""; position: absolute; top: 3px; left: 3px;
    width: 24px; height: 24px; border-radius: 50%;
    background: #fff; box-shadow: 0 1px 3px rgba(0, 0, 0, .35);
    transition: transform .2s ease;
  }
  .switch-input:checked + .switch { background: var(--green); border-color: rgba(255, 255, 255, .6); }
  .switch-input:checked + .switch::after { transform: translateX(24px); }
  .switch-input:focus-visible + .switch { outline: 2px solid var(--blue); outline-offset: 2px; }
  .form-error { color: #F87171; font-size: 12px; text-align: center; margin-bottom: 12px; }
  .btn {
    display: inline-flex; align-items: center; justify-content: center; gap: 8px;
    border-radius: 16px; font-weight: 700; transition: background .15s ease, transform .1s ease, color .15s ease;
  }
  .btn:active { transform: scale(.99); }
  .btn-white { background: #fff; color: var(--ink); }
  .btn-white:hover { background: #F4F4F5; }
  .btn-block { width: 100%; padding: 14px 16px; font-size: 15px; box-shadow: 0 4px 6px -1px rgba(0, 0, 0, .2); }
  .btn-demo { display: block; width: 100%; margin-top: 10px; padding: 6px 0; font-size: 12px; color: #9CA3AF; text-align: center; }
  .btn-demo:hover { color: #fff; }
  .login-foot { text-align: center; }
  .login-foot p:first-child { color: #D4D4D8; font-weight: 700; font-size: 12.5px; letter-spacing: .02em; }
  .login-foot p + p { color: #D4D4D8; font-weight: 400; font-size: 11.5px; margin-top: 2px; }

  /* ---------- App: cabecera, contenido y navegación ---------- */
  .app-header {
    display: flex; align-items: flex-start; justify-content: space-between; gap: 10px;
    padding: 26px 24px 12px; background: #fff; z-index: 5;
  }
  .logo-sm { justify-content: flex-start; }
  .logo-sm .logo-fadu { font-size: 28px; }
  .logo-sm .logo-bien { font-size: 16px; margin-left: 5px; }
  .app-header h1 { font-size: 24px; font-weight: 800; line-height: 1.15; margin-top: 2px; letter-spacing: -.02em; }
  .header-actions { display: flex; align-items: center; gap: 8px; margin-top: 4px; }
  .map-pill {
    display: inline-flex; align-items: center; gap: 5px;
    background: #ECFDF5; color: #047857; font-size: 12px; font-weight: 700;
    padding: 10px 11px; border-radius: 16px;
  }
  .map-pill:hover { background: #D1FAE5; }
  .icon-btn {
    display: inline-flex; align-items: center; justify-content: center;
    width: 36px; height: 36px; border-radius: 16px;
    background: #F4F4F5; color: #52525B;
  }
  .icon-btn:hover { background: #E4E4E7; }
  .icon-btn.ghost { background: #3F3F46; color: #E4E4E7; }
  .icon-btn.ghost:hover { background: #52525B; color: #fff; }

  .app-main {
    flex: 1; overflow-y: auto; overflow-x: hidden;
    padding: 4px 20px 112px;
    display: flex; flex-direction: column; gap: 16px;
    scrollbar-width: none;
  }
  .app-main::-webkit-scrollbar { display: none; }

  .stack { display: flex; flex-direction: column; gap: 12px; }
  .stack-lg { display: flex; flex-direction: column; gap: 16px; }

  .card { background: #fff; border: 1px solid var(--line); border-radius: 22px; padding: 16px; }
  .card-dark { background: var(--dark); color: #fff; border: 1px solid #2F2F2F; border-radius: 26px; padding: 20px; }
  .eyebrow { display: inline-block; font-size: 10.5px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; }
  .eyebrow.green { color: var(--green); }
  .muted { color: var(--muted); }

  /* ---------- Inicio: perfil ---------- */
  .profile-top { display: flex; align-items: flex-start; justify-content: space-between; gap: 14px; }
  .profile-id { display: flex; align-items: center; gap: 14px; min-width: 0; }
  .avatar {
    position: relative; width: 74px; height: 74px; flex: none;
    border: 1px solid #A1A1AA; border-radius: 18px; background: #1B1B1B;
    display: flex; align-items: center; justify-content: center; overflow: hidden;
    color: #E53935; font-size: 12px; font-weight: 600; letter-spacing: .1em;
  }
  .avatar:hover { border-color: #34D399; }
  .avatar-initials {
    width: 100%; height: 100%; display: flex; align-items: center; justify-content: center;
    background: linear-gradient(135deg, #2563EB, #10B981);
    color: #fff; font-size: 22px; font-weight: 900; letter-spacing: -.02em;
  }
  .avatar-hover {
    position: absolute; inset: 0; background: rgba(0, 0, 0, .5);
    display: flex; align-items: center; justify-content: center; color: #fff;
    opacity: 0; transition: opacity .15s ease;
  }
  .avatar:hover .avatar-hover { opacity: 1; }
  .profile-name { font-size: 21px; font-weight: 700; line-height: 1.08; color: #fff; }
  .profile-career { color: var(--blue); font-size: 13px; font-weight: 600; margin-top: 5px; }
  .profile-age { color: #D4D4D8; font-size: 12.5px; }
  .pill-green {
    flex: none; padding: 4px 14px; border: 1px solid var(--green); border-radius: 999px;
    color: var(--green); font-size: 12.5px; font-weight: 500; transition: all .15s ease;
  }
  .pill-green:hover { background: var(--green); color: #fff; }
  .profile-bio { color: #D4D4D8; font-size: 12.5px; line-height: 1.4; margin-top: 14px; }
  .stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-top: 16px; }
  .stats button {
    padding: 10px 8px; text-align: center; color: #fff;
    border: 1px solid #A1A1AA; border-radius: 16px; background: rgba(255, 255, 255, .03);
    transition: border-color .15s ease;
  }
  .stats button:hover { border-color: #fff; }
  .stats b { display: block; font-size: 22px; font-weight: 400; line-height: 1; }
  .stats span { display: block; font-size: 11.5px; color: #D4D4D8; margin-top: 4px; }

  /* ---------- Inicio: banner del mapa ---------- */
  .map-banner {
    display: flex; align-items: center; justify-content: space-between; gap: 12px;
    width: 100%; text-align: left; color: #fff; padding: 16px;
    border: 1px solid rgba(16, 185, 129, .3); border-radius: 24px;
    background: linear-gradient(100deg, #1A2E26, #1E3A2F 55%, #232323);
    transition: filter .15s ease;
  }
  .map-banner:hover { filter: brightness(1.12); }
  .map-banner-body { display: flex; align-items: center; gap: 14px; min-width: 0; }
  .map-banner-icon {
    width: 48px; height: 48px; flex: none; border-radius: 16px;
    display: flex; align-items: center; justify-content: center;
    background: rgba(21, 184, 108, .2); border: 1px solid rgba(21, 184, 108, .5); color: var(--green);
  }
  .map-banner-icon .icon { width: 24px; height: 24px; }
  .map-badge {
    display: inline-block; background: var(--green); color: #000;
    font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: .06em;
    padding: 2px 8px; border-radius: 999px; margin-bottom: 4px;
  }
  .map-banner-title { font-size: 14.5px; font-weight: 700; line-height: 1.3; }
  .map-banner-sub { font-size: 11.5px; color: rgba(167, 243, 208, .85); margin-top: 2px; }
  .map-banner > .icon { color: #34D399; }
  .map-banner:hover > .icon { transform: translateX(3px); }
  .map-banner > .icon { transition: transform .15s ease; }

  /* ---------- Inicio: alertas ---------- */
  .section-head { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin: 4px 4px 10px; }
  .section-title { display: flex; align-items: center; gap: 8px; }
  .section-title h3 { font-size: 15px; font-weight: 800; }
  .count-pill {
    background: #E4E4E7; color: #3F3F46; font-size: 11px; font-weight: 600;
    padding: 2px 9px; border-radius: 999px; white-space: nowrap;
  }
  .alert-card { background: #fff; border: 1px solid #E5E7EB; border-radius: 20px; padding: 16px; }
  .alert-top { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-bottom: 6px; }
  .badge {
    display: inline-block; font-size: 10.5px; font-weight: 700;
    padding: 2px 10px; border-radius: 999px; border: 1px solid transparent;
  }
  .badge.blue { background: rgba(59, 130, 246, .1); color: #2563EB; border-color: rgba(59, 130, 246, .2); }
  .badge.emerald { background: rgba(16, 185, 129, .1); color: #047857; border-color: rgba(16, 185, 129, .2); }
  .badge.purple { background: rgba(168, 85, 247, .1); color: #7E22CE; border-color: rgba(168, 85, 247, .2); }
  .alert-meta { display: flex; align-items: center; gap: 8px; flex: none; }
  .alert-time { font-size: 11px; color: #9CA3AF; }
  .alert-dismiss { color: #9CA3AF; padding: 2px; border-radius: 6px; }
  .alert-dismiss:hover { color: #3F3F46; background: #F4F4F5; }
  .alert-card h4 { font-size: 14px; font-weight: 700; line-height: 1.3; }
  .alert-card p { font-size: 12.5px; color: #4B5563; line-height: 1.5; margin-top: 4px; }
  .alert-actions { display: flex; justify-content: flex-end; margin-top: 12px; }
  .btn-dark {
    display: inline-flex; align-items: center; gap: 6px;
    background: var(--dark); color: #fff; font-size: 12px; font-weight: 700;
    padding: 7px 14px; border-radius: 12px;
  }
  .btn-dark:hover { background: #000; }

  /* ---------- Filtros y buscador ---------- */
  .search-wrap { position: relative; display: flex; align-items: center; }
  .search-wrap > .icon { position: absolute; left: 14px; color: #9CA3AF; }
  .search-wrap input {
    width: 100%; background: #F4F4F5; border: 0; border-radius: 16px;
    padding: 11px 16px 11px 40px; font-size: 12px; font-weight: 500; outline: none;
  }
  .search-wrap input:focus { box-shadow: 0 0 0 2px var(--dark); }
  .chips-row { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 2px; scrollbar-width: none; }
  .chips-row::-webkit-scrollbar { display: none; }
  .chip {
    flex: none; padding: 6px 12px; border-radius: 12px;
    background: #F4F4F5; color: #52525B; font-size: 12px; font-weight: 700;
    transition: background .15s ease, color .15s ease;
  }
  .chip:hover { background: #E4E4E7; }
  .chip.active { background: var(--dark); color: #fff; }
  .shift-bar {
    display: flex; align-items: center; justify-content: space-between; gap: 8px;
    background: #F4F4F5; border-radius: 16px; padding: 6px;
  }
  .shift-bar > span { font-size: 11px; font-weight: 700; color: #6B7280; padding-left: 10px; }
  .shift-bar > div { display: flex; gap: 4px; }
  .shift {
    padding: 4px 10px; border-radius: 12px; font-size: 11px; font-weight: 700; color: #52525B;
    transition: background .15s ease, color .15s ease;
  }
  .shift:hover { background: #E4E4E7; }
  .shift.active { background: var(--green); color: #fff; box-shadow: 0 1px 2px rgba(0, 0, 0, .12); }

  /* ---------- Deportes ---------- */
  .sport-card { background: var(--dark); color: #fff; border: 1px solid #2F2F2F; border-radius: 22px; padding: 16px; }
  .sport-top { display: flex; align-items: flex-start; justify-content: space-between; gap: 10px; }
  .sport-cat { font-size: 10px; font-weight: 700; letter-spacing: .07em; text-transform: uppercase; color: var(--green); }
  .sport-name { font-size: 17px; font-weight: 700; color: #fff; margin-top: 2px; }
  .branch-toggle { display: flex; gap: 4px; background: #141414; border: 1px solid #3F3F46; border-radius: 12px; padding: 4px; flex: none; }
  .branch-toggle button {
    padding: 4px 10px; border-radius: 8px; font-size: 11px; font-weight: 700; color: #A1A1AA;
    transition: background .15s ease, color .15s ease;
  }
  .branch-toggle button:hover { color: #fff; }
  .branch-toggle button.active { background: var(--blue); color: #fff; }
  .sport-tag {
    flex: none; padding: 4px 10px; border-radius: 12px; background: #3F3F46;
    border: 1px solid #52525B; color: #D4D4D8; font-size: 11px; font-weight: 600; text-align: right;
  }
  .sport-details {
    display: grid; grid-template-columns: 1fr 1fr; gap: 8px;
    margin-top: 12px; padding-top: 12px; border-top: 1px solid #3F3F46;
    font-size: 12px; color: #D4D4D8;
  }
  .sport-details > div { display: flex; align-items: center; gap: 6px; min-width: 0; }
  .sport-details .icon { color: var(--green); }
  .sport-details > div:first-child .icon { color: var(--blue); }
  .sport-details span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .sport-foot { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-top: 14px; }
  .sport-coach { font-size: 11.5px; color: #A1A1AA; min-width: 0; }
  .sport-coach strong { color: #34D399; }
  .btn-enroll {
    flex: none; display: inline-flex; align-items: center; gap: 6px;
    padding: 6px 16px; border-radius: 12px; font-size: 12px; font-weight: 700;
    background: #fff; color: var(--ink); transition: background .15s ease;
  }
  .btn-enroll:hover { background: #E4E4E7; }
  .btn-enroll.on { background: var(--green); color: #fff; }
  .empty { text-align: center; padding: 28px 16px; color: #9CA3AF; font-size: 12.5px; border: 1px dashed #D4D4D8; border-radius: 18px; }

  /* ---------- Mente ---------- */
  .mente-hero { position: relative; overflow: hidden; }
  .badge-conf {
    display: inline-flex; align-items: center; gap: 6px;
    background: rgba(168, 85, 247, .2); border: 1px solid rgba(192, 132, 252, .35);
    color: #D8B4FE; font-size: 11px; font-weight: 700;
    padding: 3px 10px; border-radius: 999px;
  }
  .mente-hero h3 { font-size: 19px; font-weight: 700; line-height: 1.3; margin-top: 8px; }
  .mente-hero p { font-size: 12px; color: #D4D4D8; line-height: 1.55; margin-top: 6px; }
  .form-card { display: flex; flex-direction: column; gap: 14px; }
  .form-card-head { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
  .form-card-head h4 { font-size: 15px; font-weight: 800; }
  .mini-pill {
    flex: none; background: #ECFDF5; color: #047857; font-size: 11px; font-weight: 700;
    padding: 2px 10px; border-radius: 999px; white-space: nowrap;
  }
  .label-sm { display: block; font-size: 11.5px; font-weight: 700; color: #4B5563; margin-bottom: 6px; }
  .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .seg { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .seg button {
    padding: 8px 12px; border-radius: 12px; border: 1px solid var(--line);
    background: #F9FAFB; color: #4B5563; font-size: 12px; font-weight: 700; transition: all .15s ease;
  }
  .seg button.active { background: var(--dark); border-color: var(--dark); color: #fff; }
  select, .text-input, textarea {
    width: 100%; background: #F4F4F5; border: 1px solid transparent; border-radius: 12px;
    padding: 8px 12px; font-size: 12px; font-weight: 600; color: #1F2937; outline: none;
  }
  select:focus, .text-input:focus, textarea:focus { border-color: var(--dark); background: #fff; }
  .btn-green { background: var(--green); color: #fff; padding: 13px 16px; border-radius: 16px; font-size: 12px; font-weight: 700; width: 100%; }
  .btn-green:hover { background: #10A05C; }
  .workshop { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 12px; border-radius: 16px; background: #F9FAFB; border: 1px solid #E5E7EB; }
  .workshop p { font-size: 12px; font-weight: 700; color: #111827; }
  .workshop small { display: block; font-size: 11px; color: #6B7280; margin-top: 2px; }
  .workshop small b { color: #9333EA; font-weight: 600; }
  .btn-mini { flex: none; padding: 6px 12px; border-radius: 12px; background: var(--dark); color: #fff; font-size: 11px; font-weight: 700; }
  .btn-mini.on { background: #9333EA; }
  .bridge { display: flex; align-items: center; justify-content: space-between; gap: 12px; background: #022C22; color: #fff; border-radius: 22px; padding: 16px; }
  .bridge h5 { font-size: 12px; font-weight: 700; margin-top: 2px; }
  .bridge p { font-size: 11px; color: rgba(167, 243, 208, .8); }
  .bridge .eyebrow { color: #34D399; }
  .btn-calm { flex: none; padding: 8px 12px; border-radius: 12px; background: var(--green); color: #000; font-size: 12px; font-weight: 700; }

  /* ---------- Grupos ---------- */
  .group-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; border-radius: 24px; }
  .group-head h3 { font-size: 14px; font-weight: 700; }
  .group-head p { font-size: 12px; color: #D4D4D8; margin-top: 2px; line-height: 1.45; }
  .btn-create {
    flex: none; display: inline-flex; align-items: center; gap: 4px;
    background: var(--green); color: #000; padding: 10px 14px; border-radius: 16px; font-size: 12px; font-weight: 700;
  }
  .btn-create:hover { background: #34D399; }
  .map-link {
    display: flex; align-items: center; justify-content: space-between; gap: 12px; text-align: left;
    background: #ECFDF5; border: 1px solid #A7F3D0; border-radius: 16px; padding: 14px;
  }

  function closeModal() {

  function toggleSportEnrollment(id) {
    const sport = SPORTS.find((s) => s.id === id);
    if (!sport) return;
    const branch = sport.hasBranches ? state.sports.branch[id] : null;
    const info = sport.hasBranches ? sport.branches[branch] : sport.schedule;
    const sourceKey = branch ? sport.id + '-' + branch : sport.id;

    if (hasSource(sourceKey)) {
      removeSource(sourceKey);
      showToast('Cancelaste tu inscripción a ' + sport.name + (branch ? ' (' + branch + ')' : '') + '.');
    } else {
      addActivity({
        title: sport.name + (branch ? ' (' + branch + ')' : ''),
        day: info.day,
        time: info.time,
        location: info.location,
        type: 'deporte',
        sourceId: sourceKey
      });
      showToast('¡Inscripción confirmada en ' + sport.name + (branch ? ' (' + branch + ')' : '') + '! Ya está en Mi Cursada.');
    }
    render();
  }

  function toggleWorkshop(id) {
    const wk = WORKSHOPS.find((w) => w.id === id);
    if (!wk) return;
    const index = state.workshops.indexOf(id);
    if (index !== -1) {
      state.workshops.splice(index, 1);
      removeSource('wk-' + id);
      showToast('Te desanotaste del taller "' + wk.title + '".');
    } else {
      state.workshops.push(id);
      addActivity({
        title: wk.title,
        day: wk.day,
        time: wk.time,
        location: wk.location,
        type: 'taller',
        sourceId: 'wk-' + id
      });
      showToast('¡Lugar reservado en el taller "' + wk.title + '"!');
    }
    render();
  }

  function toggleGroup(id) {
    const grp = state.groups.find((g) => g.id === id);
    if (!grp) return;
    if (grp.joined) {
      grp.joined = false;
      grp.members = Math.max(0, grp.members - 1);
      removeSource('gr-' + id);
      showToast('Saliste del grupo "' + grp.title + '".');
    } else {
      if (grp.members >= grp.maxMembers) {
        showToast('El grupo "' + grp.title + '" está completo.');
        return;
      }
      grp.joined = true;
      grp.members += 1;
      addActivity({
        title: grp.title,
        day: grp.day.split(' y ')[0],
        time: grp.time,
        location: grp.meetingPoint,
        type: grp.sport.indexOf('Running') !== -1 ? 'ruta' : 'deporte',
        sourceId: 'gr-' + id
      });
      showToast('¡Te uniste a "' + grp.title + '". Ya está agendado.');
    }
    render();
  }

  function toggleRoute() {
    const route = selectedRoute();
    const index = state.routes.joined.indexOf(route.id);
    if (index !== -1) {
      state.routes.joined.splice(index, 1);
      removeSource(route.id);
      showToast('Saliste de la salida grupal "' + route.title + '".');
    } else {
      state.routes.joined.push(route.id);
      addActivity({
        title: 'Salida: ' + route.title,
        day: route.day,
        time: route.time,
        location: 'Puerta principal Pabellón III',
        type: 'ruta',
        sourceId: route.id
      });
      showToast('¡Anotado en "' + route.title + '". Te esperamos en la puerta del Pab. III.');
    }
    render();
  }

  function goTab(tab) {
    state.tab = tab;
    state.modal = null;
    render(true);
  }

  /* =======================================================================
     EVENTOS
     ======================================================================= */
  document.addEventListener('click', function (event) {
    const overlay = event.target.closest('.overlay');
    if (overlay && event.target === overlay) {
      closeModal();
      return;
    }

    const trigger = event.target.closest('[data-action]');
    if (!trigger) return;
    const action = trigger.getAttribute('data-action');

    switch (action) {
      case 'forgot':
        state.modal = 'forgot';
        render();
        break;

      case 'forgot-send':
        state.modal = null;
        render();
        showToast('Te enviamos un enlace de recuperación a tu correo @fadu.uba.ar.');
        break;

      case 'close-modal':
        closeModal();
        break;

      case 'demo':
        state.loginError = '';
        state.loggedIn = true;
        state.tab = 'inicio';
        render(true);
        showToast('Bienvenido Pedro. Sesión demo iniciada.');
        break;

      case 'logout':
        state.loggedIn = false;
        state.modal = null;
        state.loginError = '';
        render(true);
        showToast('Cerraste sesión en FADU Bienestar.');
        break;

      case 'go':
        goTab(trigger.getAttribute('data-tab'));
        break;

      case 'open-map':
        state.modal = 'map';
        render();
        break;

      case 'alert-dismiss':
        state.alerts = state.alerts.filter((a) => a.id !== trigger.getAttribute('data-id'));
        render();
        break;

      case 'alert-action': {
        const target = trigger.getAttribute('data-target');
        if (target === 'map') {
          state.modal = 'map';
          render();
        } else {
          goTab(target);
        }
        break;
      }

      case 'sport-cat':
        state.sports.cat = trigger.getAttribute('data-cat');
        render();
        break;

      case 'sport-shift':
        state.sports.shift = trigger.getAttribute('data-shift');
        render();
        break;

      case 'sport-branch':
        state.sports.branch[trigger.getAttribute('data-id')] = trigger.getAttribute('data-branch');
        render();
        break;

      case 'sport-enroll':
        toggleSportEnrollment(trigger.getAttribute('data-id'));
        break;

      case 'psych-modality':
        state.psych.modality = trigger.getAttribute('data-mod');
        render();
        break;

      case 'workshop':
        toggleWorkshop(trigger.getAttribute('data-id'));
        break;

      case 'calm':
        state.tab = 'deportes';
        state.sports.cat = 'Cuerpo y Calma';
        state.sports.shift = 'Todos';
        state.sports.search = '';
        render(true);
        break;

      case 'group-join':
        toggleGroup(trigger.getAttribute('data-id'));
        break;

      case 'open-group':
        state.modal = 'group';
        render();
        break;

      case 'open-subject':
        state.modal = 'subject';
        render();
        break;

      case 'day':
        state.day = trigger.getAttribute('data-day');
        render();
        break;

      case 'activity-delete': {
        const id = trigger.getAttribute('data-id');
        const activity = state.enrolled.find((a) => a.id === id);
        if (!activity) break;
        state.enrolled = state.enrolled.filter((a) => a.id !== id);
        if (activity.sourceId) {
          state.groups.forEach((g) => {
            if ('gr-' + g.id === activity.sourceId) {
              g.joined = false;
              g.members = Math.max(0, g.members - 1);
            }
          });
          const rIndex = state.routes.joined.indexOf(activity.sourceId);
          if (rIndex !== -1) state.routes.joined.splice(rIndex, 1);
        }
        render();
        showToast('Quitaste "' + activity.title + '" de tu agenda.');
        break;
      }

      case 'route-type':
        state.routes.type = trigger.getAttribute('data-type');
        if (state.routes.type !== 'Todos' && !visibleRoutes().some((r) => r.id === state.routes.selectedId)) {
          state.routes.selectedId = visibleRoutes()[0].id;
        }
        render();
        break;

      case 'route-select':
        state.routes.selectedId = trigger.getAttribute('data-id');
        render();
        break;

      case 'route-join':
        toggleRoute();
        break;

      case 'edit-profile':
        state.modal = 'profile';
        render();
        break;

      default:
        break;
    }
  });

  document.addEventListener('input', function (event) {
    if (event.target.id === 'sport-search') {
      state.sports.search = event.target.value;
      const list = document.getElementById('sports-list');
      if (list) list.innerHTML = sportsCards();
    }
  });

  document.addEventListener('change', function (event) {
    const el = event.target;
    if (el.id === 'keep-logged') state.keepLogged = el.checked;
    if (el.id === 'psych-day') state.psych.day = el.value;
    if (el.id === 'psych-time') state.psych.time = el.value;
    if (el.id === 'psych-reason') state.psych.reason = el.value;
  });

  document.addEventListener('submit', function (event) {
    const form = event.target;
    const id = form.id;
    if (!id) return;
    event.preventDefault();

    if (id === 'login-form') {
      const cuil = (document.getElementById('cuil') || {}).value || '';
      const password = (document.getElementById('password') || {}).value || '';
      state.cuil = cuil;
      state.password = password;
      if (!cuil.trim() || !password.trim()) {
        state.loginError = 'Ingresá tu CUIL y contraseña para continuar.';
        render();
        return;
      }
      state.loginError = '';
      state.loggedIn = true;
      state.tab = 'inicio';
      render(true);
      showToast('Sesión iniciada. ¡Bienvenido/a a FADU Bienestar!');
      return;
    }

    if (id === 'profile-form') {
      const p = state.profile;
      p.firstName = (document.getElementById('pf-first') || {}).value || p.firstName;
      p.lastName = (document.getElementById('pf-last') || {}).value || p.lastName;
      p.career = (document.getElementById('pf-career') || {}).value || p.career;
      const ageEl = document.getElementById('pf-age');
      const age = parseInt(ageEl ? ageEl.value : '', 10);
      p.age = isNaN(age) ? p.age : age;
      p.bio = (document.getElementById('pf-bio') || {}).value || p.bio;
      const avatar = document.getElementById('avatar-toggle');
      p.showPhotoAvatar = !!(avatar && avatar.checked);
      state.modal = null;
      render();
      showToast('Perfil actualizado correctamente.');
      return;
    }

    if (id === 'psych-form') {
      removeSource('ps-1');
      addActivity({
        title: 'Entrevista de Orientación Psicológica',
        day: state.psych.day,
        time: state.psych.time,
        location: state.psych.modality === 'Virtual (Videollamada)'
          ? 'Videollamada · Consultoría FADU'
          : 'Consultoría Psicológica · Pab. III',
        type: 'mente',
        sourceId: 'ps-1'
      });
      state.day = state.psych.day;
      render();
      showToast('Turno confidencial agendado para el ' + state.psych.day + ' a las ' + state.psych.time + '.');
      return;
    }

    if (id === 'group-form') {
      const title = ((document.getElementById('nf-title') || {}).value || '').trim();
      if (!title) {
        showToast('Poné un título para tu convocatoria.');
        return;
      }
      const sport = (document.getElementById('nf-sport') || {}).value || 'Running Costanera';
      const day = (document.getElementById('nf-day') || {}).value || 'Jueves';
      const time = ((document.getElementById('nf-time') || {}).value || '').trim() || '13:00 hs';
      const meeting = ((document.getElementById('nf-meeting') || {}).value || '').trim() || 'Pabellón III';
      const newGroup = {
        id: nextId('gr'),
        title: title,
        sport: sport,
        day: day,
        time: time,
        meetingPoint: meeting,
        members: 1,
        maxMembers: 12,
        creator: state.profile.firstName + ' ' + state.profile.lastName + ' (Vos)',
        joined: true
      };
      state.groups.unshift(newGroup);
      addActivity({
        title: title,
        day: day,
        time: time,
        location: meeting,
        type: sport.indexOf('Running') !== -1 ? 'ruta' : 'deporte',
        sourceId: 'gr-' + newGroup.id
      });
      state.modal = null;
      render();
      showToast('Grupo publicado y agendado en Mi Cursada.');
      return;
    }

    if (id === 'subject-form') {
      const title = ((document.getElementById('nm-title') || {}).value || '').trim();
      if (!title) {
        showToast('Escribí el nombre de la materia.');
        return;
      }
      const day = (document.getElementById('nm-day') || {}).value || 'Lunes';
      const time = ((document.getElementById('nm-time') || {}).value || '').trim() || '14:00 - 18:00 hs';
      const location = ((document.getElementById('nm-location') || {}).value || '').trim() || 'Pabellón III';
      state.academic.push({ id: nextId('ac'), title: title, day: day, time: time, location: location });
      state.day = day;
      state.modal = null;
      render(true);
      showToast('Materia agregada a Mi Cursada.');
    }
  });

  document.addEventListener('keydown', function (event) {
    if (event.key === 'Escape' && state.modal) closeModal();
  });

  /* =======================================================================
     INICIO
     ======================================================================= */
  render();
})();
</script>
</body>
</html>
